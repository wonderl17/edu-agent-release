name: Release
run-name: Release · ${{ inputs.operation }} · ${{ inputs.source_repository }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Desktop publication or original-package recovery; Cloud uses Tencent Production
        type: choice
        default: desktop
        options: [desktop, resume]
      source_repository:
        description: Private source repository
        type: choice
        default: shukezhinao/edu-agent
        options: [shukezhinao/edu-agent, wonderl17/edu-agent]
      source_sha:
        description: Full source commit SHA; empty resolves main once
        type: string
        default: ''
      target:
        description: Cloud deployment target
        type: choice
        default: all
        options: [all, web, api, worker]
      run_migration:
        description: Run database migrations for backend targets
        type: boolean
        default: true
      pre_migration_repair:
        description: Explicit allowlisted migration repair
        type: choice
        default: none
        options: [none, resolve_wrong_question_variant_diagrams_20260608, resolve_grading_task_list_indexes_20260718]
      confirm_release:
        description: Explicit authorization for a product release
        type: choice
        default: 'no'
        options: ['no', 'yes']

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.ref == 'refs/heads/main' &&
      (inputs.operation == 'desktop' || inputs.operation == 'resume') &&
      vars.RELEASES_ENABLED == 'true' && inputs.confirm_release == 'yes'
    runs-on: ${{ inputs.operation == 'desktop' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 180
    environment: production-release
    concurrency:
      group: desktop-release-production
      cancel-in-progress: false
    permissions:
      # Public Release installer assets; the token never enters private code.
      contents: write
      deployments: write
      id-token: write
    steps:
      - name: Checkout public controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          # No cache input: dependencies and private build outputs are ephemeral.
      - name: Set up .NET
        if: inputs.operation == 'desktop'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Set up Java for configured Windows signing
        if: inputs.operation == 'desktop' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_TRUSTED_SIGNING_ENDPOINT != '' && vars.AZURE_TRUSTED_SIGNING_ACCOUNT != '' && vars.AZURE_TRUSTED_SIGNING_PROFILE != ''
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Authenticate configured Windows signing
        if: inputs.operation == 'desktop' && vars.AZURE_CLIENT_ID != '' && vars.AZURE_TENANT_ID != '' && vars.AZURE_SUBSCRIPTION_ID != '' && vars.AZURE_TRUSTED_SIGNING_ENDPOINT != '' && vars.AZURE_TRUSTED_SIGNING_ACCOUNT != '' && vars.AZURE_TRUSTED_SIGNING_PROFILE != ''
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Run isolated private release stage
        env:
          PUBLIC_GH_TOKEN: ${{ github.token }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          SOURCE_REPOSITORY: ${{ inputs.source_repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_TARGET: ${{ inputs.target }}
          RUN_MIGRATION: ${{ inputs.run_migration }}
          PRE_MIGRATION_REPAIR: ${{ inputs.pre_migration_repair }}
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          DESKTOP_UPDATE_BASE_URL: ${{ vars.DESKTOP_UPDATE_BASE_URL }}
          DESKTOP_UPDATE_BUCKET: ${{ vars.DESKTOP_UPDATE_BUCKET }}
          DESKTOP_UPDATE_S3_ENDPOINT: ${{ vars.DESKTOP_UPDATE_S3_ENDPOINT }}
          DESKTOP_UPDATE_S3_REGION: ${{ vars.DESKTOP_UPDATE_S3_REGION }}
          DESKTOP_UPDATE_S3_ACCESS_KEY_ID: ${{ secrets.DESKTOP_UPDATE_S3_ACCESS_KEY_ID }}
          DESKTOP_UPDATE_S3_SECRET_ACCESS_KEY: ${{ secrets.DESKTOP_UPDATE_S3_SECRET_ACCESS_KEY }}
          DESKTOP_UPDATE_R2_BUCKET: ${{ secrets.DESKTOP_UPDATE_R2_BUCKET }}
          DESKTOP_UPDATE_R2_BASE_URL: https://pub-7d60b01306ac4cf3a0ac442102bc9b2c.r2.dev
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_REGION: auto
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ vars.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ vars.AZURE_TRUSTED_SIGNING_PROFILE }}
          WINDOWS_VPK_SIGN_EXCLUDE: ${{ vars.WINDOWS_VPK_SIGN_EXCLUDE }}
          WINDOWS_VPK_SIGN_PARALLEL: ${{ vars.WINDOWS_VPK_SIGN_PARALLEL }}
          SMART_REPLY_SMOKE_EMAIL: ${{ secrets.SMART_REPLY_SMOKE_EMAIL }}
          SMART_REPLY_SMOKE_PASSWORD: ${{ secrets.SMART_REPLY_SMOKE_PASSWORD }}
        run: python3 scripts/release.py
      - name: Remove ephemeral private workspace
        if: always()
        shell: bash
        run: |
          set +x
          rm -rf -- "$RUNNER_TEMP/edu-agent-private-source"
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'release-private-*' -exec rm -rf -- {} +
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'release-checkpoints-*' -exec rm -rf -- {} +
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'release-auth-*' -exec rm -rf -- {} +
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'private-desktop-release-*' -exec rm -rf -- {} +
          find "$RUNNER_TEMP" -maxdepth 1 -type d -name 'installer-mirror-*' -exec rm -rf -- {} +
