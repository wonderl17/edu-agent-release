name: Tencent validation
run-name: Tencent validation · ${{ inputs.operation || 'automatic' }}

on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Verify only, deploy an exact trusted source, or check versions
        type: choice
        default: verify
        options: [verify, deploy, automatic]
      source_sha:
        description: Full canonical main-history SHA; empty resolves main once
        type: string
        default: ''
      confirm_release:
        description: Authorize deployment to the Tencent validation site only
        type: choice
        default: 'no'
        options: ['no', 'yes']

permissions:
  contents: read

concurrency:
  group: tencent-validation-release
  cancel-in-progress: false

jobs:
  validation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # Source deploy keys are prohibited by the private repository. This uses
    # its existing App authentication, requesting read access to one repo only.
    # No Production cloud credentials or OIDC permission enter this workflow.
    environment: production-release
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Run isolated Tencent controller
        env:
          PUBLIC_GH_TOKEN: ${{ github.token }}
          PUBLIC_REPOSITORY: ${{ github.repository }}
          RELEASE_APP_ID: ${{ vars.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          TENCENT_VALIDATION_DEPLOY_SSH_KEY: ${{ secrets.TENCENT_VALIDATION_DEPLOY_SSH_KEY }}
          TENCENT_VALIDATION_SSH_KNOWN_HOSTS: ${{ vars.TENCENT_VALIDATION_SSH_KNOWN_HOSTS }}
          TENCENT_VALIDATION_ENABLED: ${{ vars.TENCENT_VALIDATION_ENABLED }}
          TENCENT_VALIDATION_AUTOMATIC_ENABLED: ${{ vars.TENCENT_VALIDATION_AUTOMATIC_ENABLED }}
          TENCENT_VALIDATION_BASELINE_VERSION: ${{ vars.TENCENT_VALIDATION_BASELINE_VERSION }}
          TENCENT_OPERATION: ${{ inputs.operation || 'automatic' }}
          TENCENT_SOURCE_SHA: ${{ inputs.source_sha }}
          TENCENT_CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: python3 scripts/tencent_validation.py

